<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GulTop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .header {
      background: white;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .container {
      padding: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category {
      background: white;
      border-radius: 16px;
      padding: 22px 10px;
      text-align: center;
      font-size: 17px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .category span {
      display: block;
      font-size: 34px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🌹 GulTop</div>
    <div class="subtitle">Gullarni oson toping va buyurtma qiling</div>
  </div>

  <div class="container">

    <div class="title">
      🌷 Gul turini tanlang
    </div>

    <div class="categories">

      <div class="category">
        <span>🌹</span>
        Atirgul
      </div>

      <div class="category">
        <span>🌷</span>
        Liliya
      </div>

      <div class="category">
        <span>💐</span>
        Tayyor buket
      </div>

      <div class="category">
        <span>🌸</span>
        Boshqa gullar
      </div>

    </div>

  </div>

</body>
</html>
