<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GulTop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .header {
      background: white;
      padding: 20px 16px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .container {
      padding: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 8px;
    }

    .filter {
      border: none;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.06);
    }

    .filter.active {
      background: #e91e63;
      color: white;
    }

    .flowers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .flower {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .flower-image {
      width: 100%;
      height: 150px;
      background: #fce4ec;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .flower-info {
      padding: 12px;
    }

    .flower-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .flower-category {
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .flower-price {
      font-size: 16px;
      font-weight: bold;
      color: #e91e63;
      margin-bottom: 8px;
    }

    .flower-description {
      color: #666;
      font-size: 12px;
      line-height: 1.4;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🌹 GulTop</div>

    <div class="subtitle">
      Gullarni oson toping va buyurtma qiling
    </div>
  </div>

  <div class="container">

    <div class="title">
      🌷 Gullar
    </div>

    <div class="filters" id="filters">
      <button class="filter active" onclick="filterFlowers('all')">
        Barchasi
      </button>
    </div>

    <div id="flowers" class="flowers">
      <div class="loading">
        🌷 Gullar yuklanmoqda...
      </div>
    </div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxNoB7HYdshhy8NpPPQ_h20V-5Z6_6sDDEwI3NUvpqEJIw4pBeNqJuD_863tJ7bB0B10g/exec";

    let allFlowers = [];


    async function loadFlowers() {

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("API xatosi");
        }

        const flowers = await response.json();

        allFlowers = flowers.filter(function(flower) {
          return flower.status === "Faol" || flower.status === "";
        });

        createFilters();

        showFlowers(allFlowers);

      } catch (error) {

        document.getElementById("flowers").innerHTML =
          '<div class="empty">❌ Gullarni yuklashda xatolik yuz berdi.</div>';

        console.log(error);
      }
    }


    function createFilters() {

      const filters = document.getElementById("filters");

      const categories = [];

      allFlowers.forEach(function(flower) {

        if (
          flower.category &&
          !categories.includes(flower.category)
        ) {
          categories.push(flower.category);
        }

      });


      categories.forEach(function(category) {

        const button = document.createElement("button");

        button.className = "filter";

        button.innerText = category;

        button.onclick = function() {
          filterFlowers(category);
        };

        filters.appendChild(button);

      });

    }


    function filterFlowers(category) {

      const buttons = document.querySelectorAll(".filter");

      buttons.forEach(function(button) {
        button.classList.remove("active");
      });


      if (category === "all") {

        buttons[0].classList.add("active");

        showFlowers(allFlowers);

        return;
      }


      buttons.forEach(function(button) {

        if (button.innerText === category) {
          button.classList.add("active");
        }

      });


      const filtered = allFlowers.filter(function(flower) {

        return flower.category === category;

      });


      showFlowers(filtered);

    }


    function showFlowers(flowers) {

      const container = document.getElementById("flowers");

      container.innerHTML = "";


      if (flowers.length === 0) {

        container.innerHTML =
          '<div class="empty">🌷 Hozircha bu kategoriyada gul yo‘q.</div>';

        return;
      }


      flowers.forEach(function(flower) {

        const card = document.createElement("div");

        card.className = "flower";


        const price = Number(flower.price || 0)
          .toLocaleString("uz-UZ");


        card.innerHTML = `

          <div class="flower-image">
            🌹
          </div>

          <div class="flower-info">

            <div class="flower-name">
              ${flower.name || "Nomsiz gul"}
            </div>

            <div class="flower-category">
              ${flower.category || ""}
            </div>

            <div class="flower-price">
              ${price} so‘m
            </div>

            <div class="flower-description">
              ${flower.description || ""}
            </div>

          </div>

        `;


        container.appendChild(card);

      });

    }


    loadFlowers();

  </script>

</body>
</html>
